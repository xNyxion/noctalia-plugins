id          = "nyx/radio-player"
name        = "Radio Player"
version     = "2.0.1"
plugin_api  = 24
author      = "nyx"
license     = "MIT"
icon        = "radio"
description = "Browse radio-browser.info stations, star the keepers, and play them headless via mpv. Ships a curated metal folder."
tags        = ["media", "radio", "audio", "metal", "network"]
dependencies = ["mpv"]

# Favorites are NOT a setting: they live in favorites.json in the plugin data
# dir, owned by the service. A string_list setting would make the star button
# unable to write them back, and would not survive as structured data.

[[setting]]
key             = "volume"
type            = "int"
label_key       = "settings.volume.label"
description_key = "settings.volume.description"
default         = 85
min             = 0
max             = 100

[[setting]]
key             = "search_limit"
type            = "int"
label_key       = "settings.search_limit.label"
description_key = "settings.search_limit.description"
default         = 25
min             = 5
max             = 50

[[widget]]
id    = "widget"
entry = "widget.luau"

  # Free the middle button for the script; every widget otherwise gets a
  # built-in "open settings" binding that swallows onMiddleClick.
  [widget.actions]
  middle = "none"

[[service]]
id    = "radio-service"
entry = "service.luau"

[[panel]]
id              = "player"
entry           = "panel.luau"
width           = 420
height          = 620
placement       = "floating"
position        = "auto"
open_near_click = true
